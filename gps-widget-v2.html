<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Extraction GPS des photos</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
</head>
<body style="font-family:sans-serif;padding:8px">
<div id="msg">En attente d'une ligne…</div>
<pre id="diag" style="font-size:12px;white-space:pre-wrap;color:#555"></pre>
<button id="all">Traiter toutes les lignes</button>
<script>
const msg = t => document.getElementById('msg').textContent = t;
const diag = t => document.getElementById('diag').textContent = t;
const attIds = v => Array.isArray(v) ? v.filter(x => typeof x === 'number') : [];

// Télécharge la photo et lit son GPS. Renvoie {gps, info} (info = détails de diagnostic).
async function gpsOf(attId) {
  const {token, baseUrl} = await grist.docApi.getAccessToken({readOnly: true});
  const r = await fetch(`${baseUrl}/attachments/${attId}/download?auth=${token}`);
  if (!r.ok) throw new Error('Téléchargement impossible (HTTP ' + r.status + ')');
  const buf = await r.arrayBuffer();
  const head = Array.from(new Uint8Array(buf.slice(0, 12)));
  const ascii = head.map(c => (c >= 32 && c < 127) ? String.fromCharCode(c) : '.').join('');
  const isJpeg = head[0] === 0xFF && head[1] === 0xD8;
  const isHeic = /ftyp(heic|heix|mif1|msf1|hevc)/.test(ascii);
  let tags = null;
  try { tags = await exifr.parse(buf, true); } catch (e) { /* pas d'EXIF lisible */ }
  const gps = await exifr.gps(buf).catch(() => undefined);
  const info = [
    `Pièce jointe n° ${attId}`,
    `Type : ${r.headers.get('content-type')}`,
    `Taille : ${buf.byteLength} octets`,
    `Format détecté : ${isJpeg ? 'JPEG' : isHeic ? 'HEIC' : 'autre (' + ascii + ')'}`,
    `EXIF présent : ${tags ? 'oui (' + Object.keys(tags).length + ' champs)' : 'non'}`,
    `Champs GPS : ${tags ? (Object.keys(tags).filter(k => k.startsWith('GPS')).join(', ') || 'aucun') : 'aucun'}`,
  ].join('\n');
  return {gps, info};
}

async function process(id, photo, lat) {
  const ids = attIds(photo);
  if (!ids.length || lat) return {status: 'skip'};
  const {gps, info} = await gpsOf(ids[0]);
  if (!gps) return {status: 'nogps', info};
  await grist.selectedTable.update({id, fields: {Latitude: gps.latitude, Longitude: gps.longitude}});
  return {status: 'ok', info};
}

grist.ready({requiredAccess: 'full'});

grist.onRecord(async rec => {
  try {
    const s = await process(rec.id, rec.Photo, rec.Latitude);
    msg(s.status === 'ok' ? 'Coordonnées enregistrées'
      : s.status === 'nogps' ? 'Pas de GPS dans cette photo'
      : 'Rien à faire (photo absente ou coordonnées déjà remplies)');
    diag(s.info || '');
  } catch (e) { msg('Erreur : ' + e.message); diag(''); }
});

document.getElementById('all').onclick = async () => {
  try {
    const t = await grist.fetchSelectedTable();
    let ok = 0, nogps = 0, last = '';
    for (let i = 0; i < t.id.length; i++) {
      const s = await process(t.id[i], t.Photo[i], t.Latitude[i]);
      if (s.status === 'ok') ok++;
      if (s.status === 'nogps') { nogps++; last = s.info; }
    }
    msg(`${ok} lignes mises à jour, ${nogps} sans GPS`);
    diag(last ? 'Dernière photo sans GPS :\n' + last : '');
  } catch (e) { msg('Erreur : ' + e.message); }
};
</script>
</body>
</html>
